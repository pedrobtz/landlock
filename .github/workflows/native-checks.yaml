on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the four workflows it changes: quick skips the asan
# containers, valgrind and cran-special, and runs gctorture at step 500
# instead of 20. lto, rchk and analyzers take minutes either way and run on
# every push.
#
# All seven apply to this package: rglue.c is .Call code (rchk, gctorture),
# the core is hand-written C with error paths that unwind through R
# (sanitizers, valgrind, -fanalyzer), and the public header lk.h is shared by
# six translation units (lto). Tests must tolerate the slowdown these legs
# impose: no tight wall-clock assertions (design §12).
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      # The defaults plus --errors-for-leak-kinds=definite. Every forked child
      # ends by raise(SIGKILL) without freeing (design section 5.6), so its
      # heap is full of "possibly lost" blocks (setenv's environ copies, R's
      # own allocations) that valgrind otherwise counts as errors. Definite
      # leaks, invalid accesses and uninitialised reads still fail the job,
      # in the session and in every child: the children stay instrumented
      # because the package's own C runs there.
      valgrind-opts: "--leak-check=full --track-origins=yes --num-callers=30 --errors-for-leak-kinds=definite"
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
